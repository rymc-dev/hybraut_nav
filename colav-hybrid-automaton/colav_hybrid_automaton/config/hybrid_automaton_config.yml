
initial_mode: CRUISE
final_modes: 
  - WAYPOINT_REACHED
  - FALLBACK
params: './hybrid_automaton_params.yml'

modes:
  - name: CRUISE
    index: 0
    dynamics: proportional_velocity_controller
    invariants: []
    transitions:
      - name: cruise_to_t2los_1
        priority: 2
      - name: cruise_to_t2los_2
        priority: 3
      - name: cruise_to_fb
        priority: 0
      - name: cruise_to_waypoint_reached
        priority: 1

  - name: T2LOS
    index: 1
    dynamics: proportional_yaw_rate_controller
    invariants: []
    transitions:
      - name: t2los_to_cruise
        priority: 2
      - name: t2los_to_fb
        priority: 0
      - name: t2los_to_waypoint_reached
        priority: 1

  - name: WAYPOINT_REACHED
    index: 2
    dynamics: no_op_controller
    invariants: []
    transitions:
      - name: waypoint_reached_to_cruise
        priority: 0

  - name: FALLBACK
    index: 3
    dynamics: no_op_controller
    invariants: []
    transitions: []

states:
  - name: agent
    topic: '/state/agent'
    type: 'colav_interfaces.msg.AgentUpdate'
    update_hz: 10.0
    timeout_sec: 0.5

  - name: obstacles
    topic: '/state/obstacles'
    type: 'colav_interfaces.msg.ObstaclesUpdate'
    update_hz: 4.0
    timeout_sec: 1.0

  - name: unsafe_set
    topic: '/state/unsafe_set'
    type: 'colav_interfaces.msg.UnsafeSet'
    update_hz: 2.0
    timeout_sec: 1.5

  - name: waypoints
    topic: '/hybrid_automaton/state/waypoints'
    type: 'colav_interfaces.msg.Waypoints'
    update_hz: null
    timeout_sec: null

transitions:
  guard_params: './guard_params.yml'
  reset_params: './reset_params.yml'
  list:
    - name: cruise_to_t2los_1
      guard: is_los_clear_to_waypoint
      reset: create_virtual_waypoint

    - name: cruise_to_t2los_2
      guard: is_heading_not_within_tolerance
      reset: null

    - name: cruise_to_fb
      guard: is_unsafe_conditions
      reset: null 

    - name: cruise_to_waypoint_reached
      guard: is_waypoint_reached
      reset: null  

    - name: t2los_to_cruise
      guard: is_heading_within_tolerance
      reset: null  

    - name: t2los_to_fb
      guard: is_unsafe_conditions
      reset: null

    - name: t2los_to_waypoint_reached
      guard: is_waypoint_reached
      reset: null 

    - name: waypoint_reached_to_cruise
      guard: is_virtual_waypoints
      reset: remove_first_waypoint


invariants: [] # Reserved for future mode constraints




