# Formal Automaton Model Definition (FAMD)
# ============================================================================
# ROS2 Hybrid Automaton Framework Configuration (COLAV Hybrid Automaton)
# ============================================================================
# This defines the configuration for the Hybrid Automaton used in ROS2.
# It includes mode declarations, transitions, guards, resets, invariants,
# initial states, and parameter settings in a structured and interpretable format.
#
# IMPORTANT:
# - Python function links (guards/resets) must point to valid, importable symbols.
# - Functions must be exposed via __init__.py with __all__ to enable automatic access.
# - Module paths must be within the Python build path (not direct file paths).
#
# Hybrid Automaton formalism:
#   HA = (Q, Q_goal, X, F, Init, Inv, E, G, R)
#
#   Q      = modes
#   Q_goal = goal_modes # Optional
#   X      = states
#   F      = dynamics
#   Init   = init_mode
#   Inv    = invariants
#   E      = transitions
#   G      = guards
#   R      = resets
#
# additional param:
# params: This provides metatdata related to the hybrid automaton

# ============================================================================
# Continuous States (X)
# These are received via ROS2 topics. Metadata is included per state.
# Each of these states have buffers associated with buffer_size set in params
# ============================================================================
states:
  agent_state:
    topic: "/state/agent"
    type:
      pkg: "colav_interfaces.msg"
      msg: "AgentState"
    params:
      - update_hz: 10.0
      - timeout_sec: 0.5
      - buffer_size: 100

  obstacles_state:
    topic: "/state/obstacles"
    type:
      pkg: "colav_interfaces.msg"
      msg: "ObstaclesState"
    params:
      - update_hz: 4.0
      - timeout_sec: 1.0

  unsafe_set_state:
    topic: "/state/unsafe_set"
    type:
      pkg: "colav_interfaces.msg"
      msg: "UnsafeSetState"
    params:
      - update_hz: 2.0
      - timeout_sec: 1.5

  waypoints_state:
    topic: "/state/waypoints"
    type:
      pkg: "colav_interfaces.msg"
      msg: WaypointsState

# ============================================================================
# Reset Functions (R)
# Executed during transitions to modify continuous state.
# ============================================================================
resets:
  remove_first_waypoint:
    module: colav_hybrid_automaton.automaton.resets
    class_name: RemoveFirstWaypoint
    state_inputs:
      - "waypoints_state"
    state_outputs:
      - "waypoints_state"
    configuration: []

  generate_virtual_waypoint:
    module: colav_hybrid_automaton.automaton.resets
    class_name: GenerateVirtualWaypoint
    state_inputs:
      - "agent_state"
      - "obstacles_state"
      - "unsafe_set_state"
      - "waypoints_state"
    state_outputs:
      - "waypoints_state"
    configuration:
      longitudinal_offset_distance: 30.0
      lateral_offset_distance: 5.0
      virtual_waypoint_acceptance_radius: 20.0

# ============================================================================
# Guard Conditions (G)
# Boolean functions checked during transition evaluation.
# ============================================================================
guards:
  is_los_clear_to_waypoint:
    module: colav_hybrid_automaton.automaton.guards
    class_name: IsLOSClearToWaypoint
    state_inputs:
      - "agent_state"
      - "obstacles_state"
      - "unsafe_set_state"
      - "waypoints_state"
    configuration:
      - los_distance_threshold: 100.0

  is_heading_within_tolerance:
    module: colav_hybrid_automaton.automaton.guards
    class_name: IsHeadingWithinTolerance
    state_inputs:
      - "agent_state"
      - "waypoints_state"
    configuration:
      - heading_tolerace: 0.2

  IsHeadingNotWithinTolerance:
    module: colav_hybrid_automaton.automaton.guards
    class_name: IsHeadingNotWithinTolerance
    state_inputs:
      - "agent_state"
      - "waypoints_state"
    configuration:
      - heading_tolerance: 0.2

  is_virtual_waypoints:
    module: colav_hybrid_automaton.automaton.guards
    class_name: IsVirtualWaypoints
    state_inputs:
      - "waypoints_state"
    configuration: []

  is_unsafe_conditions:
    module: colav_hybrid_automaton.automaton.guards
    class_name: IsUnsafeConditions
    state_inputs:
      - "agent_state"
      - "obstacles_state"
      - "unsafe_set_state"
    configuration: []

  is_waypoint_reached:
    module: colav_hybrid_automaton.automaton.guards
    class_name: IsWaypointReached
    state_inputs:
      - "agent_state"
      - "waypoints_state"
    configuration: []

# ============================================================================
# Invariants (Inv)
# Leave empty if no mode constraints exist.
# ============================================================================
invariants:
  is_at_final_waypoint:
    module: colav_hybrid_automaton.automaton.invariants
    class_name: IsGoalWaypoint
    state_inputs:
      - "waypoints_state"
    configuration: []

  trivial_invariant:
    module: colav_hybrid_automaton.automaton.invariants
    class_name: TrivialInvariant
    configuration: []

  failing_invariant:
    module: colav_hybrid_automaton.automaton.invariants
    class_name: FailingInvariant
    configuration: []

# ============================================================================
# Transitions (E)
# Mapping of transition names to guard and reset functions.
# ============================================================================
transitions:
  cruise_to_t2los_1:
    guard: "is_los_clear_to_waypoint"
    reset: "generate_virtual_waypoint"

  cruise_to_t2los_2:
    guard: "is_heading_not_within_tolerance"
    reset: null

  cruise_to_fallback:
    guard: "is_unsafe_conditions"
    reset: null

  cruise_to_waypoint_reached:
    guard: "is_waypoint_reached"
    reset: null

  t2los_to_cruise:cruise_to_t2los_1:
    guard: "is_heading_within_tolerance"
    reset: null

  t2los_to_fallback:
    guard: "is_unsafe_conditions"
    reset: null

  t2los_to_waypoint_reached:
    guard: "is_waypoint_reached"
    reset: null

  waypoint_reached_to_cruise:
    guard: "is_virtual_waypoints"
    reset: "remove_first_waypoint"

# ============================================================================
# Dynamics (F)
# Controllers used for continuous evolution within each mode.
# ============================================================================
dynamics:
  dynamic_parameters:
    dynamic_parameter_names:
      - "velocity"
      - "yaw_rate"
    dynamic_parameter_value_types:
      - float
      - float
    dynamic_parameter_metrics:
      - "m/s"
      - "rad/s"

  dynamic_classes:
    cruise_pid_controller:
      module: colav_hybrid_automaton.automaton.dynamics
      class_name: PIDYawVelocityController
      state_inputs:
        - "agent_state"
        - "waypoints_state"
      configuration:
        target_velocity: 25.0 # updated cruise speed
        yaw_kp: 0.3 # gentle heading proportional gain
        yaw_ki: 0.01 # small integral for smooth correction
        yaw_kd: 0.05 # small derivative gain to damp oscillations
        vel_kp: 0.5 # moderate velocity proportional gain
        vel_ki: 0.05 # small integral to avoid windup
        vel_kd: 0.05 # small derivative for smooth velocity changes
        error_tolerance: 0.01 # precision in heading error
        max_yaw_rate: 0.1 # limit yaw rate to gentle turns

    t2los_pid_controller:
      module: colav_hybrid_automaton.automaton.dynamics
      class_name: PIDYawVelocityController
      state_inputs:
        - "agent_state"
        - "waypoints_state"
      configuration:
        target_velocity: 25.0 # updated cruise speed
        yaw_kp: 0.3 # gentle heading proportional gain
        yaw_ki: 0.01 # small integral for smooth correction
        yaw_kd: 0.05 # small derivative gain to damp oscillations
        vel_kp: 0.5 # moderate velocity proportional gain
        vel_ki: 0.05 # small integral to avoid windup
        vel_kd: 0.05 # small derivative for smooth velocity changes
        error_tolerance: 0.01 # precision in heading error
        max_yaw_rate: 0.1 # limit yaw rate to gentle turns

    no_op_controller:
      module: colav_hybrid_automaton.automaton.dynamics
      class_name: NoOpController
      state_inputs: []
      configuration: []

# ============================================================================
# Modes (Q)
# Discrete states, each associated with dynamics, invariants, and transitions.
# ============================================================================
modes:
  cruise:
    index: 0
    dynamics: "proportional_velocity_controller"
    invariants: trivial_invariant
    transitions:
      cruise_to_fallback:
        priority: 0
      cruise_to_waypoint_reached:
        priority: 1
      cruise_to_t2los_1:
        priority: 2
      cruise_to_t2los_2:
        priority: 3

  t2los:
    index: 1
    dynamics: "proportional_yaw_rate_controller"
    invariants: trivial_invariant
    transitions:
      t2los_to_fallback:
        priority: 0
      t2los_to_cruise:
        priority: 1
      t2los_to_waypoint_reached:
        priority: 2

  waypoint_reached:
    index: 2
    dynamics: "no_op_controller"
    invariants: is_at_final_waypoint
    transitions:
      waypoint_reached_to_cruise:
        priority: 0

  fallback:
    index: 3
    dynamics: "no_op_controller"
    invariants: failing_invariant
    transitions: []

# ============================================================================
# Goal Modes (Q_goal)
# ============================================================================
goal_modes:
  - waypoint_reached

# ============================================================================
# Initial Mode (Init)
# This is the mode the hybrid automaton will initially enter on
# automaton activation
# ============================================================================
initial_mode: "cruise"

# ============================================================================
# Parameters
# these are parameters of the hybrid automaton set on
# activation
# ============================================================================
parameters:
  goal_waypoint:
    type:
      pkg: "colav_interfaces.msg"
      msg: "Waypoint"

  evaluation_frequency:
    type: float

  control_frequency:
    type: float
