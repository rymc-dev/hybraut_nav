automaton_name: "tb3_control"
automaton_description: "simple automaton for turtlebot3 waypoint reaching"
version: "v0.0.1"
transition_evaluation_frequency_hz: 10.0
control_frequency_hz: 10.0


states:
  current_pose:
    topic: "/tb3/pose"
    type:
      pkg: "geometry_msgs.msg"
      msg: "PoseStamped"
  goal_pose:
    topic: "/tb3/goal"
    type:
      pkg: "geometry_msgs.msg"
      msg: "PoseStamped"

guards:
  guard.waypoint_reached:
    module: tb3_aci.guards
    class_name: WaypointReachedGuard
    configuration:
      tolerance: 0.2

invariants:
  invariant.loop:
    module: tb3_aci.invariants
    class_name: LoopInvariant

  invariant.fail:
    module: tb3_aci.invariants 
    class_name: FailingInvariant

# No resets needed for simple example

dynamics:
  dynamics.SimpleVelocityController.navigate:
    module: tb3_aci.dynamics
    class_name: SimpleVelocityController
    configuration:
      speed: 0.5
    output:
      topic: "/cmd_vel"
      type: 
        pkg: "geometry_msgs.msg"
        msg: "Twist"
  
  dynamics.SimpleVelocityController.stop:
    module: tb3_aci.dynamics
    class_name: SimpleVelocityController
    configuration:
      speed: 0.0
    output:
      topic: "/cmd_vel"
      type: 
        pkg: "geometry_msgs.msg"
        msg: "Twist"

transitions:
  to_stop:
    target_mode: 1
    guard: guard.waypoint_reached
    reset: null

modes:
  0:
    name: "navigate"
    dynamics: dynamics.SimpleVelocityController.navigate
    invariants: [invariant.loop]
    transitions:
      0: to_stop
  1:
    name: "stop"
    dynamics: dynamics.SimpleVelocityController.stop  # speed=0 configured below
    invariants: [invariant.fail]
    transitions: []



initial_mode: 0
goal_modes: 
  - 1