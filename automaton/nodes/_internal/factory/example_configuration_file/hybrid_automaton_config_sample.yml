# ============================================================================
# ROS2 Hybrid Automaton Framework Configuration (Minimal Sample)
# ============================================================================
# This defines the configuration for the Hybrid Automaton used in ROS2.
# It includes mode declarations, transitions, guards, resets, invariants,
# initial states, and parameter settings in a structured and interpretable format.
#
# IMPORTANT:
# - Python function links (guards/resets) must point to valid, importable symbols.
# - Functions must be exposed via __init__.py with __all__ to enable automatic access.
# - Module paths must be within the Python build path (not direct file paths).
#
# Hybrid Automaton formalism:
#   HA = (Q, Q_goal, X, F, Init, Inv, E, G, R)
#
#   Q      = modes
#   Q_goal = modes_goal # Optional
#   X      = states
#   F      = dynamics
#   Init   = init
#   Inv    = invariants
#   E      = transitions
#   G      = guards
#   R      = resets
#
# additional param: 
# params: This provides metatdata related to the hybrid automaton

# ----------------------------------------------------------------------------
# Continuous States (X)
# ----------------------------------------------------------------------------
states:
  example_state:
    topic: '/example/topic'
    type:
      pkg: 'example_interfaces.msg'
      msg: 'ExampleMsg'
    params:
      - update_hz: 1.0
      - timeout_sec: 2.0

# ----------------------------------------------------------------------------
# Reset Functions (R)
# ----------------------------------------------------------------------------
resets:
  example_reset:
    module: hybrid_automaton.scripts.resets
    function: example_reset_function
    state_inputs:
      - 'example_state'
    state_outputs:
      - 'example_state'

# ----------------------------------------------------------------------------
# Guard Conditions (G)
# ----------------------------------------------------------------------------
guards:
  example_guard:
    module: hybrid_automaton.scripts.guards
    function: example_guard_function
    state_inputs:
      - 'example_state'

# ----------------------------------------------------------------------------
# Invariants (Inv)
# ----------------------------------------------------------------------------
invariants: {}

# ----------------------------------------------------------------------------
# Transitions (E)
# ----------------------------------------------------------------------------
transitions:
  example_transition:
    guard: 'example_guard'
    reset: 'example_reset'

# ----------------------------------------------------------------------------
# Dynamics (F)
# ----------------------------------------------------------------------------
dynamics:
  example_controller:
    module: hybrid_automaton.scripts.dynamics
    function: example_dynamics_function

# ----------------------------------------------------------------------------
# Modes (Q)
# ----------------------------------------------------------------------------
modes:
  example_mode:
    index: "0"
    function: 'example_controller'
    transitions:
      example_transition:
        priority: 0

# ----------------------------------------------------------------------------
# Goal Modes (Q_goal)
# ----------------------------------------------------------------------------
modes_goal:
  - example_mode

# ----------------------------------------------------------------------------
# Initial Mode (Init)
# ----------------------------------------------------------------------------
init:
  mode: 'example_mode'

# ----------------------------------------------------------------------------
# Parameters
# ----------------------------------------------------------------------------
params:
  transition_evaluation_hz: 1.0
  transition_evaluation_timeout: 2.0
