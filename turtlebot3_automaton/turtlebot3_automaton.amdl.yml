# TURTLEBOT3 Hybrid Automaton Formal Automaton Model Definition (FAMD)
# ============================================================================
# ROS2 Hybrid Automaton Framework Configuration (TurtleBot3 Navigation)
# ============================================================================
# This defines a minimal working hybrid automaton for controlling a TurtleBot3.
# The automaton enables basic waypoint navigation and safe recovery behavior.
#
# This configuration is useful as a learning or demo setup using simple states,
# transitions, and ROS2 topics.

# ----------------------------------------------------------------------------
# Parameters (metadata)
# ----------------------------------------------------------------------------
automaton_name: "turtlebot3_automaton"
automaton_description: "A simple hybrid automaton for waypoint-based navigation with TurtleBot3"
automaton_type: "hybrid"
automaton_configuration: 
  evaluation_frequency: 100
  control_frequency: 50

# ----------------------------------------------------------------------------
# States (X)
# ----------------------------------------------------------------------------
states:
  odom:
    topic: "/odom"
    description: "Odometry information of the TurtleBot3"
    type:
      pkg: "nav_msgs.msg"
      msg: "Odometry"
    params:
      update_hz: 10.0
      timeout_sec: 1.0

  waypoint:
    topic: "/target_waypoint"
    description: "Current navigation target"
    type:
      pkg: "geometry_msgs.msg"
      msg: "PoseStamped"
    params:
      update_hz: 1.0
      timeout_sec: 2.0

# ----------------------------------------------------------------------------
# Invariants (Inv)
# ----------------------------------------------------------------------------
invariants:
  always_true:
    module: turtlebot3_automaton.invariants
    class_name: AlwaysTrueInvariant

# ----------------------------------------------------------------------------
# Resets (R)
# ----------------------------------------------------------------------------
resets:
  clear_waypoint:
    module: turtlebot3_automaton.resets
    class_name: ClearWaypointReset

# ----------------------------------------------------------------------------
# Guards (G)
# ----------------------------------------------------------------------------
guards:
  close_to_waypoint:
    module: turtlebot3_automaton.guards
    class_name: CloseToWaypointGuard
    configuration:
      distance_threshold: 0.5

# ----------------------------------------------------------------------------
# Dynamics (F)
# ----------------------------------------------------------------------------
dynamics:
  basic_nav:
    module: turtlebot3_automaton.dynamics
    class_name: BasicNavigationDynamics
    configuration:
      control_frequency: 10
      linear_velocity: 0.2
      angular_velocity: 0.5

  stopped:
    module: turtlebot3_automaton.dynamics
    class_name: NoOpControllerDynamics

# ----------------------------------------------------------------------------
# Transitions (E)
# ----------------------------------------------------------------------------
transitions:
  reach_waypoint:
    origin_modes: [0]
    origin_priorities: [0]
    target_mode: 1
    guard: "close_to_waypoint"
    reset: "clear_waypoint"

  resume_navigation:
    origin_modes: [1]
    origin_priorities: [0]
    target_mode: 0
    guard: "close_to_waypoint"
    reset: null



# ----------------------------------------------------------------------------
# Modes (Q)
# ----------------------------------------------------------------------------
modes:
  0:
    name: navigating
    description: "TurtleBot3 is navigating toward the current waypoint."
    dynamics: basic_nav
    invariants: [always_true]
    transitions:
      - reach_waypoint:
          priority: 0

  1:
    name: idle
    description: "TurtleBot3 is idle after reaching the waypoint."
    dynamics: stopped
    invariants: [always_true]
    transitions:
      - resume_navigation:
          priority: 0

# ----------------------------------------------------------------------------
# Goal Modes (Q_goal)
# ----------------------------------------------------------------------------
goal_modes:
  - 1

# ----------------------------------------------------------------------------
# Initial Mode (Init)
# ----------------------------------------------------------------------------
initial_mode: 0

